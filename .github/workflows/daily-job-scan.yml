name: Daily job scan

on:
  schedule:
    # 12:00 UTC = 7am ET (8am during EST) — adjust to taste.
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PROFILE_OVERRIDE_JSON: ${{ secrets.PROFILE_OVERRIDE_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/main.py

      - name: Commit updated results
        run: |
          git config user.name "job-agent-bot"
          git config user.email "actions@github.com"
          git add docs/jobs.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Daily job scan $(date -u +%Y-%m-%d)"
          git push
